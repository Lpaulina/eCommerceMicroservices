services:
  configserver:
    image: ecommerce/configserver:0.0.1-SNAPSHOT
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"
    networks:
      backend:
        aliases:
          - "configserver"

  commerce-service:
    image: ecommerce/commerce-service:0.0.1-SNAPSHOT
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
    depends_on:
      commerce-db:
        condition: service_healthy
      configserver:
        condition: service_started
      kafkaserver:
        condition: service_started
#      keycloak:
#        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8081:8080"
    restart: on-failure:5
    networks:
      - backend

  customer-service:
    image: ecommerce/customer-service:0.0.1-SNAPSHOT
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5433"
      ENCRYPT_KEY: "IMSYMMETRIC"
    depends_on:
      customer-db:
        condition: service_healthy
      configserver:
        condition: service_started
      kafkaserver:
        condition: service_started
#      keycloak:
#        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8082:8080"
    restart: on-failure:5
    networks:
      - backend

  eureka-server:
    image: ecommerce/eureka-server:0.0.1-SNAPSHOT
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
    ports:
      - "8070:8070"
    depends_on:
      commerce-db:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      configserver:
        condition: service_started
    networks:
      backend:
        aliases:
          - "eureka-server"

  gateway-server:
    image: ecommerce/gateway-server:0.0.1-SNAPSHOT
    ports:
      - "8072:8072"
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
    depends_on:
      commerce-db:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      configserver:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      backend:
        aliases:
          - "gateway"

